name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-deployment-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    environment: production

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{vars.GCP_RUN_SERVICE }}
      REPOSITORY: ${{ vars.GCP_REPOSITORY }}
      IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud Cli
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Setup image information
        id: image
        run: |
          IMAGE_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
          VERSION="v0.1.${{ github.run_number }}"

          echo "base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versioned=$IMAGE_BASE:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.versioned }}" \
            .

      - name: Push versioned image
        run: docker push "${{ steps.image.outputs.versioned }}"

      - name: Deploy Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.versioned }}
          labels: |-
            ci-run-id=${{ github.event.workflow_run.id }}
            deploy-run-id=${{ github.run_id }}
