x-build-common: &build-common
  build:
    context: .
    dockerfile: Dockerfile

services:
  build-amd:
    <<: *build-common
    platform: linux/amd64
    image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/copernicus/web-service:${IMAGE_TAG:-latest}
  build-arm:
    <<: *build-common
    platform: linux/arm64
    image: copernicus:arm64
